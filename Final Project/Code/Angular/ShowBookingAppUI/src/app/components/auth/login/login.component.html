<div class="container mt-5" style="max-width: 400px;">
  <h3 class="mb-3">Login</h3>
  <div class="mb-3">
    <label>Email</label>
    <input type="email" [(ngModel)]="email" class="form-control" placeholder="Enter email">
  </div>
  <div class="mb-3">
    <label>Password</label>
    <input type="password" [(ngModel)]="password" class="form-control" placeholder="Enter password">
  </div>
  <button class="btn btn-primary w-100" (click)="login()">Login</button>
  <div class="mt-3 text-center">
    <a routerLink="/register">Don't have an account? Register</a>
  </div>
  <div *ngIf="message" class="alert alert-info mt-3">{{ message }}</div>
</div>
