<div class="login-container">
  <div class="login-card">
    <h3 class="login-title">🎬 Welcome Back</h3>
    <p class="login-subtitle">Login to continue booking with <span class="brand">FlickTix</span></p>

    <!-- Email -->
    <div class="mb-3 input-group">
      <span class="input-group-text"><i class="bi bi-envelope"></i></span>
      <input type="email" 
             [(ngModel)]="email" 
             class="form-control" 
             placeholder="Enter email">
    </div>

    <!-- Password -->
<div class="mb-3 input-group">
  <span class="input-group-text"><i class="bi bi-lock"></i></span>
  <input [type]="showPassword ? 'text' : 'password'" 
         [(ngModel)]="password" 
         class="form-control" 
         placeholder="Enter password">

  <!-- Eye icon -->
  <span class="input-group-text eye-toggle" (click)="showPassword = !showPassword">
    <i class="bi" [ngClass]="showPassword ? 'bi-eye' : 'bi-eye-slash'"></i>
  </span>
</div>

    <!-- Button -->
    <button class="btn login-btn w-100" (click)="login()">Login</button>

    <!-- Link -->
    <div class="mt-3 text-center">
      <a routerLink="/register" class="register-link">Don't have an account? Register</a>
    </div>

    <!-- Message -->
    <div *ngIf="message" class="alert alert-info mt-3">{{ message }}</div>
  </div>
</div>
