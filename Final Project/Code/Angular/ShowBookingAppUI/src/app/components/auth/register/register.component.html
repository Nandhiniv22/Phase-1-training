<div class="container mt-5" style="max-width: 400px;">
  <h3 class="mb-3">Register</h3>
  <div class="mb-3">
    <label>Name</label>
    <input type="text" [(ngModel)]="user.name" class="form-control" placeholder="Enter your name">
  </div>
  <div class="mb-3">
    <label>Email</label>
    <input type="email" [(ngModel)]="user.email" class="form-control" placeholder="Enter your email">
  </div>
  <div class="mb-3">
    <label>Contact Number</label>
    <input type="text" [(ngModel)]="user.contactNumber" class="form-control" placeholder="Enter contact number">
  </div>
  <div class="mb-3">
    <label>Password</label>
    <input type="password" [(ngModel)]="user.password" class="form-control" placeholder="Enter password">
  </div>
  <button class="btn btn-success w-100" (click)="register()">Register</button>
  <div class="mt-3 text-center">
    <a routerLink="/login">Already have an account? Login</a>
  </div>
  <div *ngIf="message" class="alert alert-info mt-3">{{ message }}</div>
</div>
