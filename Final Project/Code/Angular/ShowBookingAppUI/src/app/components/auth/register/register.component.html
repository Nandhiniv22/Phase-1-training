<div class="register-container">
  <div class="register-card">
    <h3 class="register-title">🎟️ Register for FlickTix</h3>
    <form #registerForm="ngForm" (ngSubmit)="register()" novalidate>
      
      <!-- Name -->
      <div class="mt-3 input-group">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" 
               [(ngModel)]="user.name" 
               name="name" 
               class="form-control" 
               placeholder="Enter your name"
               required
               minlength="3"
               #name="ngModel">
      </div>
      <div *ngIf="name.invalid && name.touched" class="text-danger small">
        <div *ngIf="name.errors?.['required']">Name is required.</div>
        <div *ngIf="name.errors?.['minlength']">At least 3 characters.</div>
      </div>

      <!-- Email -->
      <div class="mt-3 input-group">
        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input type="email" 
               [(ngModel)]="user.email" 
               name="email" 
               class="form-control" 
               placeholder="Enter your email"
               required
               email
               #email="ngModel">
      </div>
      <div *ngIf="email.invalid && email.touched" class="text-danger small">
        <div *ngIf="email.errors?.['required']">Email is required.</div>
        <div *ngIf="email.errors?.['email']">Enter a valid email.</div>
      </div>

      <!-- Contact -->
      <div class="mt-3 input-group">
        <span class="input-group-text"><i class="bi bi-phone"></i></span>
        <input type="text" 
               [(ngModel)]="user.contactNumber" 
               name="contactNumber" 
               class="form-control" 
               placeholder="Enter contact number"
               required
               pattern="^[0-9]{10}$"
               #contactNumber="ngModel">
      </div>
      <div *ngIf="contactNumber.invalid && contactNumber.touched" class="text-danger small">
        <div *ngIf="contactNumber.errors?.['required']">Contact is required.</div>
        <div *ngIf="contactNumber.errors?.['pattern']">Enter 10-digit number.</div>
      </div>

      <!-- Password -->
      <div class="mt-3 input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" 
               [(ngModel)]="user.password" 
               name="password" 
               class="form-control" 
               placeholder="Enter password"
               required
               minlength="6"
               #password="ngModel">
      </div>
      <div *ngIf="password.invalid && password.touched" class="text-danger small">
        <div *ngIf="password.errors?.['required']">Password is required.</div>
        <div *ngIf="password.errors?.['minlength']">Min 6 characters.</div>
      </div>

      <!-- Submit -->
      <button class="btn register-btn w-100 mt-3" type="submit" [disabled]="registerForm.invalid">
        Register
      </button>

      <!-- Link -->
      <div class="mt-3 text-center">
        <a routerLink="/login" class="login-link">Already have an account? Login</a>
      </div>

      <!-- Message -->
      <div *ngIf="message" class="alert alert-info mt-3">{{ message }}</div>
    </form>
  </div>
</div>
