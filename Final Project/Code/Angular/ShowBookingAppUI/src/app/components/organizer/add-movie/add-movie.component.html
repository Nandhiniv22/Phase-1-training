<div class="container mt-4">
  <h3>Add Movie</h3>

  <!-- Movie form -->
  <div class="form-group">
    <input class="form-control my-2" [(ngModel)]="movie.title" placeholder="Title"/>
    <input class="form-control my-2" [(ngModel)]="movie.language" placeholder="Language"/>
    <textarea class="form-control my-2" [(ngModel)]="movie.description" placeholder="Description"></textarea>
    <input class="form-control my-2" [(ngModel)]="movie.durationMinutes" type="number" placeholder="Duration in minutes"/>
    <label>Screen Type:</label>
  <select class="form-control my-2" [(ngModel)]="movie.screenType">
    <option value="2D">2D</option>
    <option value="3D">3D</option>
    <option value="IMAX">IMAX</option>
  </select>
    <!-- Show Date & Time -->
    <label>Show Date:</label>
    <input class="form-control my-2" [(ngModel)]="movie.showDate" type="date"/>

    <label>Show Time:</label>
    <input class="form-control my-2" [(ngModel)]="movie.showTime" type="time"/>
  </div>

  <!-- Seat categories -->
  <div *ngFor="let cat of seatCategories" class="form-group my-2">
    <label>{{cat.name}} Rows:</label>
    <input type="number" class="form-control" [(ngModel)]="cat.rows"/>
  </div>

  <!-- Submit button -->
  <button class="btn btn-primary mt-3" (click)="onSubmit()">Add Movie & Seats</button>

  <!-- Success / error message -->
  <div *ngIf="message" class="mt-3 alert" [ngClass]="{
        'alert-success': isSuccess,
        'alert-danger': !isSuccess
      }">
    {{ message }}
  </div>
</div>
