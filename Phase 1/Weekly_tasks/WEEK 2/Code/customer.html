<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fusion Fiesta - Menu</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>

  <style>
    body {
    background: linear-gradient(to bottom right,  #e6d3b3,#1d1f21, #e6d3b3);
    }
    .food-item {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      gap: 20px;
      background-color: #f9f9f9;
    }
    .food-img {
      width: 120px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
    }
    .add-btn {
      margin-top: 10px;
    }
    .nav-link:hover{
        font-size: 20px;
        color:#ffc107 !important;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold fs-4 text-warning" href="#">Fusion Fiesta</a>
  <div class="ms-auto d-flex align-items-center">
    <a href="customer.html" class="nav-link text-white me-3">Menu</a>
    <a href="order.html" class="nav-link text-white me-3">Orders</a>
    <a href="#" class="nav-link text-white me-3" onclick="goToCart()">
    <i class="bi bi-cart-fill"></i> Cart (<span id="cartCount">0</span>)
    </a>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container my-4">
  <h2 class="mb-4">Menu</h2>
  <div id="foodList" class="row"></div>
</div>
<footer class="bg-dark text-white text-center py-3 mt-5">
  &copy; 2025 Fusion Fiesta | All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const foodItems = [
    { id: 1, name: "Pizza", price: 250, launchDate: "2024-01-10", category: "Fast Food", freeDelivery: true, image: "https://septemberfarmcheese.b-cdn.net/wp-content/uploads/Blogs/Homemade-Pizza/homemade-pizza-monterey-jack-cheese.jpg" },
    { id: 2, name: "Burger", price: 120, launchDate: "2024-02-15", category: "Fast Food", freeDelivery: true, image: "https://blog.swiggy.com/wp-content/uploads/2025/01/Image-9_-meat-burger-1024x538.png" },
    { id: 3, name: "Sushi", price: 300, launchDate: "2024-03-01", category: "Japanese", freeDelivery: false, image: "https://www.allrecipes.com/thmb/XT7-9MROYJZvNyQR4J40HGOVDmQ=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/19511smoked-salmon-sushi-rollfabeveryday4x3-159a22b4d3ac49fe9a146db94b53c930.jpg" },
    { id: 4, name: "Dosa", price: 100, launchDate: "2024-01-05", category: "South Indian", freeDelivery: true, image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQACh1yWbIwNiWJOZ-8lkt9oGkf5cdMK4DV8Q&s" },
    { id: 5, name: "Pasta", price: 200, launchDate: "2024-04-10", category: "Italian", freeDelivery: false, image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQtGxJQNLQ_tpfDqgGfFpEARarc7qNGTDVEYg&s" },
    { id: 6, name: "Fried Rice", price: 180, launchDate: "2024-05-12", category: "Chinese", freeDelivery: true, image: "https://www.vegrecipesofindia.com/wp-content/uploads/2021/02/schezwan-fried-rice-recipe-3.jpg" },
    { id: 7, name: "Noodles", price: 150, launchDate: "2024-06-08", category: "Chinese", freeDelivery: true, image: "https://www.kitchensanctuary.com/wp-content/uploads/2024/03/Stir-Fried-Noodles-with-Beansprouts-square-FS.jpg" },
    { id: 8, name: "Paneer Tikka", price: 220, launchDate: "2024-03-18", category: "Indian", freeDelivery: false, image: "https://spicecravings.com/wp-content/uploads/2020/10/Paneer-Tikka-Featured-1.jpg" },
    { id: 9, name: "Chicken Curry", price: 280, launchDate: "2024-07-01", category: "Indian", freeDelivery: true, image: "https://spiceeats.com/wp-content/uploads/2020/07/Chicken-Hyderabadi.jpg" },
    { id: 10, name: "Ice Cream", price: 90, launchDate: "2024-02-25", category: "Dessert", freeDelivery: true, image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToNb4qLVc8li_M2NHBfEl14DaVpUCmplY5lg&s" }
  ];

  const cart = [];

  function renderMenu() {
    const foodList = document.getElementById("foodList");
    foodList.innerHTML = "";

    foodItems.forEach(item => {
      const col = document.createElement("div");
      col.className = "col-md-6";

      const card = document.createElement("div");
      card.className = "food-item";

      card.innerHTML = `
        <img src="${item.image}" class="food-img" alt="${item.name}">
        <div>
          <h5>${item.name} (₹${item.price})</h5>
          <p>ID: ${item.id}<br>
             Category: ${item.category}<br>
             Launch Date: ${item.launchDate}<br>
             Free Delivery: ${item.freeDelivery ? "Yes" : "No"}
          </p>
          <button class="btn btn-primary btn-sm add-btn" onclick='addToCart(${JSON.stringify(item)})'>
            <i class="bi bi-cart-plus"></i> Add to Cart
          </button>
        </div>
      `;

      col.appendChild(card);
      foodList.appendChild(col);
    });
  }

  function addToCart(item) {
  const user = localStorage.getItem("loggedInUser");
  if (!user) {
    alert("Please log in first.");
    return;
  }

  const cartKey = `cart_${user}`;
  const currentCart = JSON.parse(localStorage.getItem(cartKey)) || [];

  const existingItem = currentCart.find(cartItem => cartItem.name === item.name);
  if (existingItem) {
    existingItem.quantity = (existingItem.quantity || 1) + 1;
  } else {
    item.quantity = 1;
    currentCart.push(item);
  }

  localStorage.setItem(cartKey, JSON.stringify(currentCart));
  updateCartCount();  
  alert(item.name + " added to cart.");
}

  function goToCart() {
  window.location.href = 'cart.html';
}

  function updateCartCount() {
  const user = localStorage.getItem("loggedInUser");
  const cartKey = `cart_${user}`;
  const cart = JSON.parse(localStorage.getItem(cartKey)) || [];
  document.getElementById("cartCount").textContent = cart.length;
}

  function logout() {
    localStorage.removeItem('loggedInUser');
    window.location.href = 'login.html';
  }

  renderMenu();
  updateCartCount();
</script>
</body>
</html>
