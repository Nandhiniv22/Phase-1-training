<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Orders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to bottom right,  #e6d3b3,#1d1f21);
    }
    .order-card {
      background: #fff;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .order-card h5 {
      margin-bottom: 10px;
      color: #333;
    }
    .order-items {
      font-size: 15px;
      padding-left: 20px;
    }
    footer {
      background-color: #343a40;
      color: #fff;
      text-align: center;
      padding: 15px 0;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
    }
    .main-content {
      padding: 80px 20px 100px; 
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold fs-4 text-warning" href="#">Fusion Fiesta</a>
  <div class="ms-auto d-flex align-items-center">
    <a href="customer.html" class="nav-link text-white me-3">Menu</a>
    <a href="order.html" class="nav-link text-white me-3">Orders</a>
    <a href="#" class="nav-link text-white me-3" onclick="goToCart()">
    <i class="bi bi-cart-fill"></i> Cart (<span id="cartCount">0</span>)
    </a>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
  </div>
  </nav>

  <div class="container main-content">
    <h3 class="mb-4">🛒 Your Orders</h3>
    <div id="userOrders"></div>
  </div>

  <footer>
    © 2025 Fusion Fiesta | All rights reserved
  </footer>

  <script>
    window.onload = function () {
    const user = localStorage.getItem("loggedInUser");
    if (!user) {
        alert("You must be logged in.");
        window.location.href = "login.html";
        return;
    }

    const userCart = JSON.parse(localStorage.getItem(`cart_${user}`)) || [];
    document.getElementById("cartCount").textContent = userCart.length;

    const orderHistory = JSON.parse(localStorage.getItem(`orderHistory_${user}`)) || [];
    const orderContainer = document.getElementById("userOrders");

    if (orderHistory.length === 0) {
        orderContainer.innerHTML = "<div class='alert alert-info'>No orders found.</div>";
    } else {
        orderHistory.reverse().forEach(order => {
        const div = document.createElement("div");
        div.className = "order-card";
        div.innerHTML = `
            <h5>📅 Order on ${order.date}</h5>
            <p><strong>👤 Name:</strong> ${order.name}</p>
            <p><strong>📍 Address:</strong> ${order.address}</p>
            <p><strong>📞 Phone:</strong> ${order.phone}</p>
            <p><strong>💳 Payment:</strong> ${order.method.toUpperCase()}</p>
            <p><strong>💰 Total:</strong> ₹${order.total}</p>
            <div class="order-items">
            <strong>🧾 Items:</strong>
            <ul>
                ${order.items.map(item => 
                `<li>${item.name} × ${item.quantity} = ₹${item.price * item.quantity}</li>`).join("")}
            </ul>
            </div>
        `;
        orderContainer.appendChild(div);
        });
    }
    };
     function goToCart() {
    window.location.href = 'cart.html';
    }
    function logout() {
    localStorage.removeItem('loggedInUser');
    window.location.href = 'login.html';
   }
  </script>
</body>
</html>
