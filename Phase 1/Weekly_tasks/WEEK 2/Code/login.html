<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
    background-image: url("https://static.vecteezy.com/system/resources/thumbnails/037/236/579/small_2x/ai-generated-beautuful-fast-food-background-with-copy-space-free-photo.jpg");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: top;
  }
    .login-container {
      max-width: 400px;
      margin-left: 150px;
      margin-top: 120px;
      padding: 30px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h3 class="text-center mb-4">Login</h3>
    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Login</button>
      <div class="text-center mt-3">
        Don't have an account? <a href="register.html">Register</a>
      </div>
    </form>
  </div>

 <script>
  document.getElementById("loginForm").onsubmit = function (e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!username || !password) {
      alert("Username and Password are required.");
      return;
    }

    const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;
    if (!passwordRegex.test(password)) {
      alert("Invalid password format.");
      return;
    }

    if (username.toLowerCase() === "admin") {
      if (password === "Admin@123") {
        alert("Admin login successful!");
        localStorage.setItem("loggedInUser", "admin"); 
        window.location.href = "admin.html";
      } else {
        alert("Invalid admin password.");
      }
      return;
    }

    let users = JSON.parse(localStorage.getItem("users") || "[]");
    const user = users.find(u => u.fullname === username && u.password === password);

    if (user) {
      alert("Login successful!");
      localStorage.setItem("loggedInUser", username); 
      window.location.href = "customer.html?user=" + encodeURIComponent(username);
    } else {
      alert("Invalid credentials.");
    }
  };
</script>

</body>
</html>
