<!DOCTYPE html>
<html>
<head>
  <title>Customer Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-image: url("https://images.pexels.com/photos/326281/pexels-photo-326281.jpeg?cs=srgb&dl=pexels-pixabay-326281.jpg&fm=jpg");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
    }
    .register-container {
      max-width: 500px;
      margin-left: 700px;
      margin-top: 30px;
      margin-bottom: 30px;
      padding: 30px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="register-container">
    <h3 class="text-center mb-4">Customer Registration</h3>
    <form id="registerForm">
      <div class="mb-3">
        <label for="userid" class="form-label">User ID</label>
        <input type="text" id="userid" class="form-control" readonly>
      </div>
      <div class="mb-3">
        <label for="fullname" class="form-label">Full Name</label>
        <input type="text" id="fullname" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <textarea id="address" class="form-control" rows="3" required></textarea>
      </div>
     <div class="mb-3">
     <label for="contact" class="form-label">Contact Number</label>
     <input type="tel" id="contact" class="form-control" required
        pattern="[0-9]{10}" maxlength="10">
    <div class="form-text">Enter a 10-digit phone number.</div>
    </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Register</button>
      <div class="text-center mt-3">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </form>
  </div>

  <script>
    function generateUserId() {
      let id = localStorage.getItem("lastUserId") || 0;
      id = parseInt(id) + 1;
      const newId = "U" + id.toString().padStart(3, '0');
      document.getElementById("userid").value = newId;
      return newId;
    }

    const currentUserId = generateUserId();

    document.getElementById("registerForm").onsubmit = function (e) {
      e.preventDefault();

      const userid = currentUserId;
      const fullname = document.getElementById("fullname").value.trim();
      const address = document.getElementById("address").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const password = document.getElementById("password").value.trim();

      const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;
      if (!passwordRegex.test(password)) {
        alert("Password must be at least 8 characters long, include 1 uppercase letter, 1 number, and 1 special character.");
        return;
      }

      let users = JSON.parse(localStorage.getItem("users") || "[]");

      if (users.some(user => user.userid === userid)) {
        alert("User ID already exists.");
        return;
      }

      users.push({ userid, fullname, address, contact, password, role: "customer" });

      localStorage.setItem("users", JSON.stringify(users));
      localStorage.setItem("lastUserId", parseInt(userid.slice(1))); 
      alert("Registration successful!");
      window.location.href = "login.html";
    };
  </script>

</body>
</html>
