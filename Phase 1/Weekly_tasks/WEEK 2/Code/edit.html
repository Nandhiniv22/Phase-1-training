<!DOCTYPE html>
<html>
<head>
    <title>Edit Food Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{ background-color:tan;}
        .container { padding: 40px; max-width: 600px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Edit Menu Item</span>
    </nav>

    <div class="container">
        <h3><i class="bi bi-pencil-square"></i>  Edit Food Details</h3>
        <form id="editForm">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" id="name" class="form-control" disabled>
            </div>
            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="number" id="price" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <input type="text" id="category" class="form-control" required>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="freeDelivery">
                <label class="form-check-label">Free Delivery</label>
            </div>
            <button type="submit" class="btn btn-success">Save</button>
            <a href="admin.html" class="btn btn-secondary ms-2">Cancel</a>
        </form>
    </div>

    <script>
        const query = new URLSearchParams(window.location.search);
        let item = {};

        if (query.has("data")) {
            try {
                item = JSON.parse(decodeURIComponent(query.get("data")));
                document.getElementById("name").value = item.name;
                document.getElementById("price").value = item.price;
                document.getElementById("category").value = item.category;
                document.getElementById("freeDelivery").checked = item.freeDelivery;
            } catch (e) {
                alert("Invalid item data.");
            }
        }

        document.getElementById("editForm").addEventListener("submit", function(e) {
            e.preventDefault();
            item.price = document.getElementById("price").value;
            item.category = document.getElementById("category").value;
            item.freeDelivery = document.getElementById("freeDelivery").checked;
            alert("Item updated successfully!");
            window.location.href = "admin.html";
        });
    </script>
</body>
</html>
