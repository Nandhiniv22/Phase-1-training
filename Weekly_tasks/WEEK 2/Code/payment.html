<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding: 40px;
      background-color: #f5f5f5;
    }
    .item {
      background: #fff;
      padding: 10px 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    #qrPopup {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #qrContent {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
    }
    #qrContent img {
      width: 200px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4">🛍️ Complete Your Order</h2>

    <div class="card p-3 mb-4">
      <h5>📦 Delivery Address</h5>
      <div class="mb-2">
        <input type="text" id="name" class="form-control" placeholder="Full Name" required>
      </div>
      <div class="mb-2">
        <textarea id="address" class="form-control" placeholder="Delivery Address" rows="3" required></textarea>
      </div>
      <div>
        <input type="tel" id="phone" class="form-control" placeholder="Phone Number" required>
      </div>
    </div>

    <h5>🧾 Order Summary</h5>
    <div id="orderItems" class="mb-3"></div>
    <h5 id="total" class="mb-3 text-end"></h5>

    <h5>💳 Select Payment Method</h5>
    <select id="paymentMethod" class="form-select mb-3">
      <option value="">-- Select --</option>
      <option value="upi">UPI</option>
      <option value="cod">Cash on Delivery</option>
    </select>

    <button class="btn btn-primary" onclick="makePayment()">🪙 Pay Now</button>
    <div id="paymentMsg" class="alert alert-success mt-4 d-none">✅ Payment Successful!</div>
  </div>

  <div id="qrPopup">
    <div id="qrContent">
      <h5>Scan & Pay (UPI)</h5>
      <img src="https://api.qrserver.com/v1/create-qr-code/?data=upi://pay&size=200x200" alt="QR Code">
      <p id="timer">Closing in 30 seconds...</p>
    </div>
  </div>

  <script>
    const query = new URLSearchParams(window.location.search);
    const orderItems = document.getElementById("orderItems");
    const totalDisplay = document.getElementById("total");
    const nameInput = document.getElementById("name");
    const addressInput = document.getElementById("address");
    const phoneInput = document.getElementById("phone");
    let cart = [];

   
    if (query.has("data")) {
      try {
        cart = JSON.parse(decodeURIComponent(query.get("data")));
      } catch (e) {
        alert("Invalid cart data");
      }
    }

    let total = 0;
    cart.forEach(item => {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <strong>${item.name}</strong><br>
        ₹${item.price} × ${item.quantity} = ₹${item.price * item.quantity}
      `;
      orderItems.appendChild(div);
      total += item.price * item.quantity;
    });
    totalDisplay.innerText = `Total Amount: ₹${total}`;

    function saveOrderHistory(order) {
      let history = JSON.parse(localStorage.getItem("orderHistory")) || [];
      history.push(order);
      localStorage.setItem("orderHistory", JSON.stringify(history));
    }

    function makePayment() {
      const name = nameInput.value.trim();
      const address = addressInput.value.trim();
      const phone = phoneInput.value.trim();
      const method = document.getElementById("paymentMethod").value;

      if (!name || !address || !phone || !method) {
        alert("Please fill in all details and select a payment method.");
        return;
      }

      const order = {
        name,
        address,
        phone,
        method,
        items: cart,
        total,
        date: new Date().toLocaleString()
      };

      if (method === "upi") {
        showQRPopup(order);
      } else {
        finishPayment(order);
      }
    }

    function showQRPopup(order) {
      const popup = document.getElementById("qrPopup");
      const timerText = document.getElementById("timer");
      popup.style.display = "flex";

      let timeLeft = 30;
      const countdown = setInterval(() => {
        timerText.innerText = `Closing in ${timeLeft} seconds...`;
        timeLeft--;

        if (timeLeft < 0) {
          clearInterval(countdown);
          popup.style.display = "none";
          finishPayment(order);
        }
      }, 1000);
    }

   function finishPayment(order) {
  const user = localStorage.getItem("loggedInUser");
  if (!user) {
    alert("User not logged in.");
    return;
  }

  const key = `orderHistory_${user}`;
  let history = JSON.parse(localStorage.getItem(key)) || [];
  history.push(order);
  localStorage.setItem(key, JSON.stringify(history));

  localStorage.removeItem(`cart_${user}`);

  document.getElementById("paymentMsg").classList.remove("d-none");
  cart = [];

  orderItems.innerHTML = "";
  totalDisplay.innerText = "Total Amount: ₹0";
  nameInput.value = "";
  addressInput.value = "";
  phoneInput.value = "";
  document.getElementById("paymentMethod").value = "";

  setTimeout(() => {
    alert("✅ Payment Successful! Redirecting to Orders...");
    window.location.href = "order.html";
  }, 1000);
}

  </script>
</body>
</html>
