<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{ background-color:lightcyan;}
    .container { padding: 30px; }
    .food-card { margin-bottom: 20px; background-color: wheat;}
    .food-img { height: 180px; object-fit: cover; border-top-left-radius: .25rem; border-top-right-radius: .25rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold fs-4 text-warning" href="#">Fusion Fiesta - Admin</a>
  <div class="ms-auto d-flex align-items-center">
    <a href="allorders.html" class="nav-link text-white me-3">Orders</a>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

  <div class="container">
    <h3 class="mb-4">All Food Items</h3>
    <div class="row" id="foodList"></div>
  </div>
  <footer class="bg-dark text-white text-center py-3 mt-5">
    &copy; 2025 Fusion Fiesta | All rights reserved.
  </footer>


  <script>
    let defaultFoodItems = [
      { id: 1, name: "Pizza", price: 250, launchDate: "2024-01-10", category: "Fast Food", freeDelivery: true, image: "https://septemberfarmcheese.b-cdn.net/wp-content/uploads/Blogs/Homemade-Pizza/homemade-pizza-monterey-jack-cheese.jpg" },
      { id: 2, name: "Burger", price: 120, launchDate: "2024-02-15", category: "Fast Food", freeDelivery: true, image: "https://blog.swiggy.com/wp-content/uploads/2025/01/Image-9_-meat-burger-1024x538.png" },
      { id: 3, name: "Sushi", price: 300, launchDate: "2024-03-01", category: "Japanese", freeDelivery: false, image: "https://www.allrecipes.com/thmb/XT7-9MROYJZvNyQR4J40HGOVDmQ=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/19511smoked-salmon-sushi-rollfabeveryday4x3-159a22b4d3ac49fe9a146db94b53c930.jpg" },
      { id: 4, name: "Dosa", price: 100, launchDate: "2024-01-05", category: "South Indian", freeDelivery: true, image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQACh1yWbIwNiWJOZ-8lkt9oGkf5cdMK4DV8Q&s" },
      { id: 5, name: "Pasta", price: 200, launchDate: "2024-04-10", category: "Italian", freeDelivery: false, image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQtGxJQNLQ_tpfDqgGfFpEARarc7qNGTDVEYg&s" },
      { id: 6, name: "Fried Rice", price: 180, launchDate: "2024-05-12", category: "Chinese", freeDelivery: true, image: "https://www.vegrecipesofindia.com/wp-content/uploads/2021/02/schezwan-fried-rice-recipe-3.jpg" },
      { id: 7, name: "Noodles", price: 150, launchDate: "2024-06-08", category: "Chinese", freeDelivery: true, image: "https://www.kitchensanctuary.com/wp-content/uploads/2024/03/Stir-Fried-Noodles-with-Beansprouts-square-FS.jpg" },
      { id: 8, name: "Paneer Tikka", price: 220, launchDate: "2024-03-18", category: "Indian", freeDelivery: false, image: "https://spicecravings.com/wp-content/uploads/2020/10/Paneer-Tikka-Featured-1.jpg" },
      { id: 9, name: "Chicken Curry", price: 280, launchDate: "2024-07-01", category: "Indian", freeDelivery: true, image: "https://spiceeats.com/wp-content/uploads/2020/07/Chicken-Hyderabadi.jpg" },
      { id: 10, name: "Ice Cream", price: 90, launchDate: "2024-02-25", category: "Dessert", freeDelivery: true, image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToNb4qLVc8li_M2NHBfEl14DaVpUCmplY5lg&s" }
    ];

    let foodItems = JSON.parse(sessionStorage.getItem("updatedMenu")) || defaultFoodItems;

    function renderItems() {
      const container = document.getElementById("foodList");
      container.innerHTML = "";

      foodItems.forEach(item => {
        const col = document.createElement("div");
        col.className = "col-md-3 mb-4";

        col.innerHTML = `
          <div class="card food-card h-100">
            <img src="${item.image}" class="card-img-top food-img" alt="${item.name}">
            <div class="card-body">
              <h5 class="card-title">${item.name} (ID: ${item.id})</h5>
              <p class="card-text">
                Price: ₹${item.price}<br>
                Category: ${item.category}<br>
                Launch Date: ${item.launchDate}<br>
                Free Delivery:
                <input type="checkbox" ${item.freeDelivery ? "checked" : ""} disabled>
              </p>
              <button class="btn btn-primary" onclick='editItem(${JSON.stringify(item).replace(/'/g, "\\'")})'>Edit</button>
            </div>
          </div>
        `;
        container.appendChild(col);
      });
    }

    function editItem(item) {
      const data = encodeURIComponent(JSON.stringify(item));
      window.location.href = `edit.html?data=${data}`;
    }

    function logout() {
    localStorage.removeItem('loggedInUser');
    window.location.href = 'login.html';
    }

    renderItems();
  </script>
</body>
</html>
