<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #ccc5b9;
      padding-bottom: 80px;
    }
    .cart-item img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      margin-right: 15px;
    }
    .cart-item {
      background-color: #fff3cd;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
    }
    .cart-details {
      flex-grow: 1;
    }
    .nav-link:hover {
      font-size: 18px;
      color: #ffc107 !important;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold fs-4 text-warning" href="#">Fusion Fiesta</a>
  <div class="ms-auto d-flex align-items-center">
    <a href="customer.html" class="nav-link text-white me-3">Menu</a>
    <a href="order.html" class="nav-link text-white me-3">Orders</a>
    <a href="cart.html" class="nav-link text-white me-3">
      <i class="bi bi-cart-fill"></i> Cart (<span id="cartCount">0</span>)
    </a>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container">
  <h2 class="mt-5 mb-4">🛒 Your Cart</h2>
  <div id="cartContainer"></div>
  <a href="customer.html" class="btn btn-primary mt-3">← Back to Menu</a>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5 fixed-bottom">
  &copy; 2025 Fusion Fiesta | All rights reserved.
</footer>

<script src="cart.js"></script>
<script>
  const storedCart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("cartCount").textContent = storedCart.length;

  function logout() {
    localStorage.removeItem('loggedInUser');
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
